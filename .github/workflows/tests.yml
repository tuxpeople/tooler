name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # Safety net of release.yml
    inputs:
      ref:
        description: "Tag/Branch/SHA to test"
        type: string
        required: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Run ShellCheck
        env:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          SHELLCHECK_VERSION: v0.11.0
        run: docker run --rm -v "$PWD:/mnt:ro" "koalaman/shellcheck:${SHELLCHECK_VERSION}" -s sh /mnt/root/app/tooler.sh

  hadolint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  image-test:
    name: Image Smoke Test + Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local only, no push, native arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tooler:test

      # Run it like in Kubernetes (read-only root, foreign UID, no
      # capabilities) against the test configuration. Needs network access
      # to GitHub and the VS Code marketplace.
      - name: Smoke test
        run: |
          out="$RUNNER_TEMP/out" && mkdir -p "$out" && chmod 777 "$out"
          docker run --rm --read-only --user 65534:65534 --cap-drop ALL \
            -v "$PWD/tests/config.yaml:/config/config.yaml:ro" -v "$out:/output" tooler:test

          html="$out/index.html"
          grep -q "Tools Overview" "$html"
          grep -q -E 'href="https://github.com/cli/cli/releases/download/v[0-9.]+/gh_[0-9.]+_windows_amd64.zip"' "$html" \
            || { echo "::error::no GitHub release download link"; cat "$html"; exit 1; }
          grep -q -E 'redhat.vscode-yaml-[0-9][0-9.]*\.vsix' "$html" \
            || { echo "::error::no VS Code extension version"; cat "$html"; exit 1; }
          echo "✅ index.html lists the GitHub release and the VS Code extension"

          # Without a readable config file it must fail (exit code via
          # docker inspect, which is reliable on every Docker host)
          docker run --read-only --name noconfig -e CONFIGFILE=/missing.yaml tooler:test >/tmp/noconfig.log 2>&1 || true
          code=$(docker inspect --format '{{.State.ExitCode}}' noconfig)
          docker rm noconfig >/dev/null
          [[ "$code" != "0" ]] && grep -q "Cannot read config file" /tmp/noconfig.log
          echo "✅ refuses to run without a readable config"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tooler:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
